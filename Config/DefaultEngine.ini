; =====================================================================
;  TAC-OPS  -  Engine configuration (Unreal Engine 5.8)
;  Graphics target: Delta Force style (Lumen GI/reflections, Nanite,
;  Virtual Shadow Maps, TSR, volumetric fog & clouds, DX12 / SM6)
; =====================================================================

[/Script/EngineSettings.GameMapsSettings]
; The whole battlefield is generated procedurally at runtime, so the game
; boots into the (empty) engine Entry map and the TOGameMode builds the world.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/TacOps.TOGameMode
GameInstanceClass=/Script/TacOps.TOGameInstance

[/Script/Engine.Engine]
NearClipPlane=4.000000
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=True
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.VirtualTextures=True
r.CustomDepth=3
r.MegaLights.EnableForProject=True
r.VolumetricFog=1
r.SkyAtmosphere=1
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.Substrate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.CollisionProfile]
; Custom trace channel used by the ballistics simulation.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Bullet")

[/Script/NavigationSystem.NavigationSystemV1]
; The world is generated at runtime, so the nav mesh is built dynamically
; only around navigation invokers (every soldier carries one).
bGenerateNavigationOnlyAroundNavigationInvokers=True
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False
bSpawnNavDataInNavBoundsLevel=False
DataGatheringMode=Lazy

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
AgentRadius=34.000000
AgentHeight=176.000000
AgentMaxSlope=44.000000
AgentMaxStepHeight=45.000000
MaxSimultaneousTileGenerationJobsCount=256

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bEnableEnhancedDeterminism=False

[/Script/AIModule.AISystem]
bForgetStaleActors=True

[/Script/Engine.GameUserSettings]
bUseVSync=False

[SystemSettings]
r.Tonemapper.Sharpen=0.6
r.TSR.ShadingRejection.Flickering=1
